<style>
  :root{
    --paper:#FFFCF2;
    --paper-2:#F1F1EF;
    --ink:#1A1A19;
    --ink-soft:#6B6A66;
    --line:#E4E3DD;
    --cyan:#D9840F;
    --cyan-bg:#FBECD3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  h1,h2{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
  .hero img{height:64px;width:auto;margin-bottom:28px;}
  .hero h1{font-size:26px;margin:0 0 10px;}
  .hero p{color:var(--ink-soft);font-size:15px;max-width:440px;line-height:1.5;margin:0 0 26px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:4px;text-decoration:none;display:inline-block;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  footer{padding:18px;text-align:center;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);}
  footer a{color:var(--ink-soft);}
</style>
